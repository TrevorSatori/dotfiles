services:
  gluetun:
    image: qmcgaw/gluetun
    container_name: gluetun
    cap_add:
      - NET_ADMIN
    security_opt:
      - no-new-privileges:true
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      - 8080:8080 # qBittorrent Web UI
      - 6881:6881 # qBittorrent TCP
      - 6881:6881/udp # qBittorrent UDP
      - 8989:8989 # Sonarr
      - 7878:7878 # Radarr
      - 8686:8686 # Lidarr
      - 9696:9696 # Prowlarr
    environment:
      - VPN_SERVICE_PROVIDER=mullvad
      - VPN_TYPE=wireguard
      - WIREGUARD_PRIVATE_KEY=${MULLVAD_PRIVATE_KEY}
      - WIREGUARD_ADDRESSES=${MULLVAD_ADDRESS}
      - FIREWALL_OUTBOUND_SUBNETS=172.16.0.0/12,192.168.1.0/24
    restart: always

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    network_mode: "service:gluetun"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - FOWNER
    environment:
      - PUID=1800
      - PGID=1800
      - TZ=Etc/UTC
      - WEBUI_PORT=8080
    volumes:
      - ./qbittorrent/appdata:/config
      - ${MEDIA_ROOT}/downloads:/downloads
      - ${MEDIA_ROOT}:/media
    depends_on:
      gluetun:
        condition: service_healthy
    restart: always

  lidarr:
    image: lscr.io/linuxserver/lidarr:latest
    container_name: lidarr
    network_mode: "service:gluetun"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - FOWNER
    environment:
      - PUID=1800
      - PGID=1800
      - TZ=Etc/UTC
    volumes:
      - ./lidarr/config:/config
      - ${MEDIA_ROOT}/music:/music 
      - ${MEDIA_ROOT}/downloads:/downloads
    depends_on:
      gluetun:
        condition: service_healthy
    restart: always

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    network_mode: "service:gluetun"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - FOWNER
    environment:
      - PUID=1800
      - PGID=1800
      - TZ=Etc/UTC
    volumes:
      - ./sonarr/data:/config
      - ${MEDIA_ROOT}/shows:/shows
      - ${MEDIA_ROOT}/downloads:/downloads
    depends_on:
      gluetun:
        condition: service_healthy
    restart: always

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    network_mode: "service:gluetun"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - FOWNER
    environment:
      - PUID=1800
      - PGID=1800
      - TZ=Etc/UTC
    volumes:
      - ./radarr/data:/config 
      - ${MEDIA_ROOT}/movies:/movies
      - ${MEDIA_ROOT}/downloads:/downloads
    depends_on:
      gluetun:
        condition: service_healthy
    restart: always

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    network_mode: "service:gluetun" # Recommended to avoid ISP blocking indexers
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - FOWNER
    environment:
      - PUID=1800
      - PGID=1800
      - TZ=Etc/UTC
    volumes:
      - ./prowlarr/data:/config
      - ./scripts:/scripts
    depends_on:
      gluetun:
        condition: service_healthy
    restart: always

  jellyfin:
    image: jellyfin/jellyfin
    container_name: jellyfin
    user: 1800:1800
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - FOWNER
    ports:
      - '8096:8096'
    volumes:
      - ./jellyfin/config:/config
      - ./jellyfin/cache:/cache
      - type: bind
        source: ${MEDIA_ROOT}
        target: /media
    restart: unless-stopped

  calibre:
    image: lscr.io/linuxserver/calibre:latest
    container_name: calibre
    security_opt:
      - seccomp=unconfined
    environment:
      - PUID=1800
      - PGID=1800
      - TZ=Etc/UTC
    volumes:
      - ./calibre/config:/config
      - ${MEDIA_ROOT}/books:/books
    ports:
      - 8082:8080 # GUI
      - 8181:8181 # Server
      - 8084:8081 # OPDS
    shm_size: "1gb"
    restart: unless-stopped

  calibre-web:
    image: lscr.io/linuxserver/calibre-web:latest
    container_name: calibre-web
    environment:
      - PUID=1800
      - PGID=1800
      - TZ=Etc/UTC
      - DOCKER_MODS=linuxserver/mods:universal-calibre 
    volumes:
      - ./calibre-web/data:/config
      - ${MEDIA_ROOT}/books:/books # Pointed to /books to match Calibre
    ports:
      - 8083:8083
    restart: unless-stopped
