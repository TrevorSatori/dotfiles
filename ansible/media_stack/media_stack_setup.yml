- name: Configure Execution Identity and Permissions
  hosts: localhost
  become: true
  vars:
    # High-level identity variables
    exec_user_name: "lo_pan"
    exec_user_id: 1800
    exec_group_id: 1800
    
    # Capture the actual calling user (not root)
    target_real_user: "{{ ansible_env.SUDO_USER | default(lookup('env', 'USER')) }}"
    
    # Paths
    storage_pool_path: "/data"
    media_stack_path: "/opt/media_stack"
    dotfiles_path: "/home/{{ ansible_env.SUDO_USER | default(lookup('env', 'USER')) }}/.dotfiles"

  tasks:
    - name: Ensure GNU Stow is installed
      ansible.builtin.package:
        name: stow
        state: present

    - name: Ensure the execution group exists
      ansible.builtin.group:
        name: "{{ exec_user_name }}"
        gid: "{{ exec_group_id }}"
        state: present

    - name: Create the execution system user
      ansible.builtin.user:
        name: "{{ exec_user_name }}"
        uid: "{{ exec_user_id }}"
        group: "{{ exec_user_name }}"
        shell: /usr/bin/nologin
        create_home: no
        system: yes
        state: present

    - name: Link calling user to the execution group
      ansible.builtin.user:
        name: "{{ target_real_user }}"
        groups: "{{ exec_user_name }}"
        append: yes
      when: target_real_user != 'root'

    - name: Apply hardened permissions to existing storage pool
      ansible.builtin.file:
        path: "{{ storage_pool_path }}"
        owner: "{{ exec_user_id }}"
        group: "{{ exec_group_id }}"
        mode: '2775' # SetGID for group inheritance
        recurse: yes

    - name: Initialize and secure the application base path in /opt
      ansible.builtin.file:
        path: "{{ media_stack_path }}"
        state: directory
        owner: "{{ exec_user_id }}"
        group: "{{ exec_group_id }}"
        mode: '2775'
        recurse: no

    - name: Stow media_stack package to root
      ansible.builtin.command:
        cmd: "stow --dir={{ dotfiles_path }} --target=/ media_stack"
      register: stow_result
      changed_when: stow_result.rc == 0
